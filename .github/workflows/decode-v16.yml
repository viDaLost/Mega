name: Decode v16 browser source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decode-v16.yml'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Salvage app-v16 source
        run: |
          python - <<'PY'
          import re, base64, pathlib, zlib, struct
          s=pathlib.Path('app-v16.js').read_text()
          m=re.search(r"atob\('([^']+)'\)", s)
          if not m:
              raise SystemExit('embedded gzip payload not found')
          b64=m.group(1)
          b64 += '=' * (-len(b64) % 4)
          data=base64.b64decode(b64)
          flg=data[3]; pos=10
          if flg & 4:
              xlen=struct.unpack_from('<H',data,pos)[0]; pos += 2+xlen
          if flg & 8:
              pos=data.index(b'\0',pos)+1
          if flg & 16:
              pos=data.index(b'\0',pos)+1
          if flg & 2:
              pos += 2
          dec=zlib.decompressobj(-15)
          raw=dec.decompress(data[pos:])
          pathlib.Path('app-v16.partial.js').write_bytes(raw)
          print('salvaged bytes', len(raw), 'eof', dec.eof)
          PY
      - name: Report syntax status
        run: node --check app-v16.partial.js || true
      - name: Commit salvaged source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-v16.partial.js
          git diff --cached --quiet || git commit -m 'Salvage partial v16 source for repair'
          git push
