name: Deploy web game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser runtime
        run: |
          node --check app-v17.js
          node --check assets/campaign-selector.js
          node --check assets/original-levels.js
          node --check assets/xmas2-levels.js
          node --check sw.js
          grep -q 'src="app-v17.js"' index.html
          grep -q 'assets/original-levels.js' index.html
          grep -q 'assets/xmas2-levels.js' index.html
          grep -q 'assets/campaign-selector.js' index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
