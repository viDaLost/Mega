name: Build clean v17 runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v17.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v17
        run: python scripts/build_v17.py
      - name: Validate v17 JavaScript
        run: node --check app-v17.js
      - name: Commit v17
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-v17.js
          git diff --cached --quiet || git commit -m 'Build validated uncompressed app-v17 runtime'
          git push
